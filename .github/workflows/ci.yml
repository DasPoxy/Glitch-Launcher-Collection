name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Omarchy is Arch: the same Qt (qsb, qmlformat, qmllint) its users have
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git python python-pillow file qt6-declarative qt6-shadertools shellcheck

      - uses: actions/checkout@v5

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Helper tests (themes, wallpapers, fits and looks, models, previews, eggs, shaders)
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Python compiles
        run: python -m compileall -q glitch-*

      - name: Scripts
        run: |
          bash -n install.sh publish.sh glitch-globe-launcher/*.sh
          shellcheck -S warning install.sh publish.sh glitch-globe-launcher/*.sh

      - name: Plugin manifests
        run: |
          for m in glitch-*/manifest.json; do
            python -c "import json,sys,os; m=json.load(open(sys.argv[1])); d=os.path.basename(os.path.dirname(sys.argv[1])); assert m['id']==d and m.get('version') and m.get('kinds'), (d, m)" "$m"
          done

      - name: Shaders compile, and each has its .qsb committed
        run: |
          qsb=$(command -v qsb || echo /usr/lib/qt6/bin/qsb)
          bad=0
          for f in glitch-*/shaders/*.frag; do
            "$qsb" --qt6 -o /tmp/check.qsb "$f" || { echo "::error file=$f::doesn't compile"; bad=1; }
            [ -f "$f.qsb" ] || { echo "::error file=$f::no $f.qsb committed (compile it with qsb)"; bad=1; }
          done
          exit $bad

      - name: QML syntax (every file)
        run: |
          # qmlformat parses a file and exits 1 when it can't: a syntax error.
          # If it crashes on a valid file (its own bug), qmllint has the last
          # word. Quickshell's imports aren't here, so only syntax errors count.
          fmt=$(command -v qmlformat6 || command -v qmlformat || echo /usr/lib/qt6/bin/qmlformat)
          lint=$(command -v qmllint6 || command -v qmllint || echo /usr/lib/qt6/bin/qmllint)
          bad=0
          while IFS= read -r f; do
            rc=0; out=$("$fmt" "$f" 2>&1 >/dev/null) || rc=$?
            if [ $rc -eq 0 ]; then continue; fi
            if [ $rc -eq 1 ]; then echo "$out"; echo "::error file=$f::QML syntax error"; bad=1; continue; fi
            rc=0; out=$(timeout 90 "$lint" "$f" 2>&1) || rc=$?
            if [ $rc -eq 124 ]; then echo "::warning file=$f::couldn't check (qmlformat crashed, qmllint timed out)"; continue; fi
            if echo "$out" | grep -i -E "syntax error|expected token|unexpected token|unterminated"; then
              echo "::error file=$f::QML syntax error"; bad=1
            fi
          done < <(git ls-files '*.qml')
          exit $bad
